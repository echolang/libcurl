name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v5

      - uses: echolang/setup-echo@v1

      - name: Install libcurl
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install libcurl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows-static
          $prefix = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static"
          # zlib >= 1.3.2 installs its static archive as zs.lib; older ports used zlib.lib.
          $zlib = Get-ChildItem "$prefix\lib" -Filter *.lib |
            Where-Object { $_.BaseName -in 'zs', 'zlib', 'zlibstatic', 'z' } |
            Select-Object -First 1
          if (-not $zlib) { Get-ChildItem "$prefix\lib"; throw "zlib static library not found" }
          echo "LIBCURL_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "ZLIB_LIB=$($zlib.BaseName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and test
        if: runner.os != 'Windows'
        run: echoc test

      - name: Build and test
        if: runner.os == 'Windows'
        shell: pwsh
        run: echoc test --link "search:$env:LIBCURL_PREFIX\lib" --link "lib:$env:ZLIB_LIB"
