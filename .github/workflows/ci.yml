name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v5

      - uses: echolang/setup-echo@v1

      - name: Install libcurl
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install libcurl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows-static
          $prefix = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static"
          echo "LIBCURL_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and test
        if: runner.os != 'Windows'
        run: echoc test

      - name: Build and test
        if: runner.os == 'Windows'
        shell: pwsh
        run: echoc test --link "search:$env:LIBCURL_PREFIX\lib" --link lib:zlib

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create patch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            latest=$(sed -n 's/.*#\[version: "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"\].*/v\1/p' module.eco | head -n1)
          fi
          [ -n "$latest" ]
          ver=${latest#v}
          major=${ver%%.*}
          rest=${ver#*.}
          minor=${rest%%.*}
          patch=${rest#*.}
          tag="v${major}.${minor}.$((patch + 1))"
          gh release create "$tag" --title "$tag" --generate-notes
